<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#101a3c">
	<title>Neon Flight — Flappy V7</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800;900&display=swap');
		:root{color-scheme:dark;--ink:#f4f4ff;--muted:#aab3d0;--cyan:#5cf4ee;--pink:#ff70bd}
		*{box-sizing:border-box}
		body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#263b70 0,#121b3b 42%,#090e22 100%);color:var(--ink);font-family:Outfit,system-ui,sans-serif}
		body:before,body:after{content:"";position:fixed;pointer-events:none;border-radius:50%;filter:blur(1px);opacity:.28}
		body:before{width:360px;height:360px;left:-180px;top:15%;background:#5b42c9;filter:blur(100px)}body:after{width:440px;height:440px;right:-240px;bottom:-80px;background:#05b8c2;filter:blur(110px)}
		.shell{width:min(100vw,470px);padding:22px 18px 18px;position:relative;z-index:1}
		.topline{display:flex;justify-content:space-between;align-items:center;margin:0 3px 14px}
		.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.04em;font-size:15px;text-transform:uppercase}
		.brand-mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid #ffffff32;border-radius:10px;background:linear-gradient(145deg,#ffffff22,#ffffff05);box-shadow:0 0 20px #5cf4ee2a;font-size:17px}
		.version{font:10px 'DM Mono',monospace;color:#aab3d0;letter-spacing:.12em}
		.game-wrap{position:relative;width:100%;aspect-ratio:420/650;border:1px solid #ffffff25;border-radius:24px;overflow:hidden;background:#111b3c;box-shadow:0 30px 90px #030816a8,0 0 0 6px #ffffff08,inset 0 1px #ffffff38}
		canvas{display:block;width:100%;height:100%;touch-action:manipulation}
		.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:18px}
		.hud-top{display:flex;justify-content:space-between;align-items:flex-start}
		.best-pill,.sound-button{border:1px solid #ffffff28;background:#1019328c;backdrop-filter:blur(12px);border-radius:13px;color:var(--ink)}
		.best-pill{padding:9px 12px;font:10px 'DM Mono',monospace;letter-spacing:.08em;color:#d5ddf7}.best-pill b{color:var(--cyan);font-weight:500;margin-left:5px}
		.sound-button{pointer-events:auto;cursor:pointer;width:38px;height:38px;font-size:16px;display:grid;place-items:center;transition:transform .2s,background .2s}.sound-button:hover{transform:translateY(-2px);background:#263759}
		.center-ui{position:absolute;left:8%;right:8%;top:50%;transform:translateY(-50%);text-align:center;transition:opacity .2s,transform .2s}
		.center-ui.hidden{opacity:0;pointer-events:none;transform:translateY(-46%)}
		.eyebrow{font:10px 'DM Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:11px}
		h1{font-size:clamp(34px,10vw,51px);line-height:.96;letter-spacing:-.055em;margin:0 0 13px;font-weight:900;text-shadow:0 5px 25px #0a102c80}
		h1 span{color:var(--cyan)}
		.sub{color:#d3d9ee;font-size:14px;line-height:1.55;margin:0 auto 23px;max-width:245px}
		.play{border:0;border-radius:14px;padding:14px 28px;background:linear-gradient(110deg,#5cf4ee,#8df9c0);color:#102239;font:800 14px Outfit,sans-serif;letter-spacing:.025em;cursor:pointer;box-shadow:0 8px 26px #31e4d14d;transition:transform .18s,box-shadow .18s}
		.play:hover{transform:translateY(-2px) scale(1.025);box-shadow:0 12px 32px #31e4d16b}.play:active{transform:scale(.97)}
		.hint{display:block;color:#aab3d0;font:10px 'DM Mono',monospace;letter-spacing:.07em;margin-top:15px}
		.score{position:absolute;top:17%;left:0;right:0;text-align:center;font-size:clamp(52px,15vw,76px);font-weight:900;letter-spacing:-.06em;line-height:1;text-shadow:0 4px 20px #131c3d88;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s}
		.score.show{opacity:1;transform:translateY(0)}
		.score small{display:block;font:10px 'DM Mono',monospace;letter-spacing:.2em;color:#ffffffbd;margin-top:4px}
		.bottom-note{text-align:center;color:#8f9ab9;font:10px 'DM Mono',monospace;letter-spacing:.09em;margin-top:14px}
		@media(max-height:760px){.shell{width:min(100vw,390px);padding-top:12px;padding-bottom:10px}.topline{margin-bottom:9px}.bottom-note{margin-top:8px}}
		@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
	</style>
</head>
<body>
	<main class="shell">
		<header class="topline"><div class="brand"><span class="brand-mark">✦</span> Neon Flight</div><div class="version">ARCADE / V7</div></header>
		<section class="game-wrap" aria-label="Neon Flight game">
			<canvas id="game" width="420" height="650" aria-label="Flappy Bird game canvas"></canvas>
			<div class="hud">
				<div class="hud-top"><div class="best-pill">BEST <b id="best">00</b></div><button class="sound-button" id="sound" aria-label="Toggle sound" title="Toggle sound">♫</button></div>
			</div>
			<div class="score" id="score">0<small>FLIGHT SCORE</small></div>
			<div class="center-ui" id="overlay">
				<div class="eyebrow" id="eyebrow">A tiny bird. A big sky.</div>
				<h1 id="title">READY TO<br><span>SOAR?</span></h1>
				<p class="sub" id="description">Thread the neon gates and see how far you can fly.</p>
				<button class="play" id="play">START FLIGHT <span aria-hidden="true">↗</span></button>
				<span class="hint">TAP · CLICK · OR PRESS SPACE</span>
			</div>
		</section>
		<footer class="bottom-note">STAY LIGHT. FLY RIGHT.</footer>
	</main>
	<script>
	(()=>{
		const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
		const overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),description=document.querySelector('#description'),eyebrow=document.querySelector('#eyebrow'),playButton=document.querySelector('#play'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),soundButton=document.querySelector('#sound');
		const W=420,H=650,ground=590;let state='ready',bird,pipes=[],particles=[],stars=[],score=0,best=Number(localStorage.getItem('neonFlightBest')||0),last=0,spawnTimer=0,flapTime=0,soundOn=false,audio;
		bestEl.textContent=String(best).padStart(2,'0');
		for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*(ground-30),r:Math.random()*1.5+.25,a:Math.random()*.55+.15,s:Math.random()*.24+.05});
		const reset=()=>{bird={x:112,y:280,vy:0,rot:0};pipes=[];particles=[];score=0;spawnTimer=0;scoreEl.textContent='0';scoreEl.append(Object.assign(document.createElement('small'),{textContent:'FLIGHT SCORE'}));};
		reset();
		function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
		function background(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101936');g.addColorStop(.58,'#263d68');g.addColorStop(1,'#18294b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
			const glow=ctx.createRadialGradient(320,125,4,320,125,190);glow.addColorStop(0,'#ff70bd32');glow.addColorStop(1,'#ff70bd00');ctx.fillStyle=glow;ctx.fillRect(100,0,320,330);
			ctx.save();for(const s of stars){let tw=.55+Math.sin(t*.001*s.s*7+s.x)*.35;ctx.globalAlpha=s.a*tw;ctx.fillStyle='#d9f9ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.restore();
			// Distant, layered skyline
			for(let layer=0;layer<2;layer++){let base=ground-layer*13,step=layer?58:42;ctx.fillStyle=layer?'#21345a':'#19294c';for(let x=-step;x<W+step;x+=step){let h=55+((x*13+step*7)%73+73)%73;let drift=(t*.009*(layer?-.18:-.32))%(step*2);let bx=x-drift;ctx.fillRect(bx,base-h,step-4,h);if(!layer){ctx.fillStyle='#76e8ee32';for(let wy=base-h+12;wy<base-9;wy+=13)for(let wx=bx+8;wx<bx+step-10;wx+=13)ctx.fillRect(wx,wy,3,4);ctx.fillStyle='#19294c'}}}
			ctx.fillStyle='#0c1730';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#61f2df';ctx.globalAlpha=.7;ctx.fillRect(0,ground,W,2);ctx.globalAlpha=1;
			// Moving floor dashes
			ctx.fillStyle='#8ff8e34c';let offset=(t*.11)%36;for(let x=-40-offset;x<W;x+=36)ctx.fillRect(x,ground+20,19,2);
		}
		function drawPipe(p){const grad=ctx.createLinearGradient(p.x,0,p.x+p.w,0);grad.addColorStop(0,'#16b6ad');grad.addColorStop(.5,'#4de2c7');grad.addColorStop(1,'#138b9b');ctx.shadowColor='#4df4dc7a';ctx.shadowBlur=15;ctx.fillStyle=grad;
			const cap=12;roundedRect(p.x,p.top-cap,p.w,cap,5);ctx.fill();roundedRect(p.x,p.bottom,p.w,cap,5);ctx.fill();ctx.fillRect(p.x+5,0,p.w-10,p.top-cap);ctx.fillRect(p.x+5,p.bottom+cap,p.w-10,ground-p.bottom-cap);ctx.shadowBlur=0;
			ctx.fillStyle='#c2fff033';ctx.fillRect(p.x+9,4,p.w-18,p.top-cap-5);ctx.fillRect(p.x+9,p.bottom+cap+4,p.w-18,ground-p.bottom-cap-5);
		}
		function drawBird(){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);ctx.shadowColor='#ffbf5b99';ctx.shadowBlur=18;
			// tail
			ctx.fillStyle='#ff8b67';ctx.beginPath();ctx.moveTo(-14,2);ctx.lineTo(-27,-5);ctx.lineTo(-24,7);ctx.lineTo(-14,8);ctx.fill();
			let body=ctx.createLinearGradient(-14,-14,16,15);body.addColorStop(0,'#fff08c');body.addColorStop(.55,'#ffca62');body.addColorStop(1,'#ff8b67');ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,18,14,0,0,Math.PI*2);ctx.fill();
			ctx.shadowBlur=0;ctx.fillStyle='#ff9f56';ctx.beginPath();ctx.ellipse(-5,5,9,6,Math.sin(flapTime)*.22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9df';ctx.beginPath();ctx.arc(8,-5,5.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17233d';ctx.beginPath();ctx.arc(10,-5,2.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff785f';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(25,3);ctx.lineTo(14,6);ctx.closePath();ctx.fill();ctx.restore();
		}
		function puff(x,y,color){for(let i=0;i<7;i++)particles.push({x,y,vx:(Math.random()-.5)*2.8,vy:(Math.random()-.7)*2.5,r:Math.random()*3+1,life:1,color})}
		function drawParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.life-=dt/500;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
		function render(t){background(t);for(const p of pipes)drawPipe(p);drawParticles(16);drawBird()}
		function start(){if(state==='playing'){flap();return}reset();state='playing';overlay.classList.add('hidden');scoreEl.classList.add('show');bird.vy=-6.1;flapTime=0;}
		function flap(){if(state==='ready'||state==='over'){start();return}bird.vy=-6.15;flapTime=1;puff(bird.x-14,bird.y+3,'#9bfff0');if(soundOn)beep(540,.045)}
		function end(){if(state!=='playing')return;state='over';if(score>best){best=score;localStorage.setItem('neonFlightBest',best);bestEl.textContent=String(best).padStart(2,'0')}if(soundOn)beep(170,.15);eyebrow.textContent='FLIGHT COMPLETE';title.innerHTML=`NICE<br><span>TRY!</span>`;description.textContent=`You cleared ${score} ${score===1?'gate':'gates'}. The sky is calling you back.`;playButton.innerHTML='FLY AGAIN <span aria-hidden="true">↗</span>';overlay.classList.remove('hidden')}
		function update(dt,t){if(state==='playing'){bird.vy+=.38*dt/16.67;bird.y+=bird.vy*dt/16.67;bird.rot=Math.min(.95,Math.max(-.45,bird.vy*.075));spawnTimer+=dt;if(spawnTimer>1480){spawnTimer=0;let gap=160,top=105+Math.random()*245;pipes.push({x:W+20,w:66,top,bottom:top+gap,passed:false})}for(let i=pipes.length-1;i>=0;i--){const p=pipes[i];p.x-=2.55*dt/16.67;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;scoreEl.firstChild.textContent=score;if(soundOn)beep(760,.055);puff(bird.x,bird.y,'#ffdf86')}if(p.x+p.w<-5)pipes.splice(i,1);let bx=bird.x,by=bird.y;if(bx+13>p.x&&bx-13<p.x+p.w&&(by-11<p.top||by+11>p.bottom))end()}
			if(bird.y+12>=ground||bird.y-12<=0)end();flapTime+=dt*.012;
		}else if(state==='ready'){bird.y=280+Math.sin(t*.003)*8;bird.rot=Math.sin(t*.002)*.06;flapTime+=dt*.006}render(t)}
		function loop(t){let dt=Math.min(34,t-(last||t));last=t;update(dt,t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
		function beep(freq,duration){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(_){}}
		playButton.addEventListener('click',e=>{e.stopPropagation();start()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap()});soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.textContent=soundOn?'♫':'♩';soundButton.style.color=soundOn?'#5cf4ee':'';if(soundOn)beep(620,.06)});
		window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)flap()}if(e.code==='Enter'&&state!=='playing')start()});
	})();
	</script>
</body>
</html>
