<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Skybound — First-Person Flappy Flight</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07142e; }
		body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
		canvas { display: block; width: 100%; height: 100%; }
		.hud { position: fixed; inset: 0; pointer-events: none; color: white; }
		.brand { position: absolute; top: 24px; left: 28px; font-size: 12px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; color: #d7edff; text-shadow: 0 2px 14px #143a78; }
		.brand span { color: #65f2cf; }
		.score { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); text-align: center; text-shadow: 0 3px 18px #063869; }
		.score-label { font-size: 10px; letter-spacing: .25em; font-weight: 800; color: #c6e8ff; }
		#score { font-size: clamp(42px, 7vw, 72px); line-height: 1; font-weight: 900; }
		.best { position: absolute; top: 30px; right: 28px; font-size: 12px; color: #d4e9ff; font-weight: 700; }
		.best strong { color: #ffe48a; margin-left: 6px; }
		.panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(430px, calc(100vw - 36px)); padding: 32px 28px 25px; text-align: center; border: 1px solid rgba(208,238,255,.32); border-radius: 22px; background: linear-gradient(145deg, rgba(12,35,72,.83), rgba(11,24,55,.72)); box-shadow: 0 20px 70px #05132988, inset 0 1px rgba(255,255,255,.14); backdrop-filter: blur(14px); transition: opacity .25s, transform .25s; pointer-events: auto; }
		.panel.hidden { opacity: 0; transform: translate(-50%, -46%) scale(.97); pointer-events: none; }
		.eyebrow { color: #65f2cf; letter-spacing: .23em; font-size: 10px; font-weight: 900; text-transform: uppercase; }
		h1 { margin: 10px 0 8px; font-size: clamp(29px, 8vw, 43px); letter-spacing: -.055em; line-height: 1.02; }
		.panel p { color: #c2d7f0; line-height: 1.55; margin: 0 auto 20px; font-size: 14px; max-width: 325px; }
		button { border: 0; border-radius: 999px; padding: 13px 25px; color: #052b3a; background: linear-gradient(100deg, #73f5cd, #b9f1ff); font: inherit; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; box-shadow: 0 7px 28px #44e5cd44; transition: transform .15s, box-shadow .15s; }
		button:hover { transform: translateY(-2px); box-shadow: 0 10px 32px #44e5cd77; }
		.hint { margin-top: 17px; color: #9ab6d3; font-size: 11px; }
		.hint b { color: #fff; }
		.crosshair { position: absolute; left: 50%; top: 53%; width: 22px; height: 22px; transform: translate(-50%,-50%); opacity: .46; }
		.crosshair:before, .crosshair:after { content: ""; position: absolute; background: #e6f8ff; border-radius: 2px; }
		.crosshair:before { width: 1px; height: 22px; left: 10px; }
		.crosshair:after { height: 1px; width: 22px; top: 10px; }
		.help { position: absolute; left: 50%; bottom: 23px; transform: translateX(-50%); color: #c2d7ee; font-size: 11px; letter-spacing: .04em; text-shadow: 0 2px 8px #081e42; white-space: nowrap; }
		.help kbd { border: 1px solid #d5edff88; background: #102b50aa; border-radius: 5px; padding: 3px 7px; color: white; font: inherit; font-weight: 800; margin: 0 3px; }
		@media (max-width: 520px) { .brand { top: 18px; left: 16px; font-size: 10px; }.best { top: 20px; right: 16px; font-size: 10px; }.score { top: 57px; }.help { bottom: 15px; font-size: 10px; } }
	</style>
</head>
<body>
	<canvas id="game" aria-label="First-person flying game"></canvas>
	<div class="hud">
		<div class="brand">SKYBOUND <span>///</span> FLIGHT CLUB</div>
		<div class="score"><div class="score-label">FLIGHT SCORE</div><div id="score">0</div></div>
		<div class="best">BEST <strong id="best">0</strong></div>
		<div class="crosshair"></div>
		<div class="panel" id="panel">
			<div class="eyebrow" id="eyebrow">First-person flight</div>
			<h1 id="title">Find your wings.</h1>
			<p id="message">Soar through the sky, thread the neon gates, and see how far you can fly.</p>
			<button id="start">Take off</button>
			<div class="hint">Tap, click, or press <b>SPACE</b> to flap</div>
		</div>
		<div class="help">TAP / CLICK / <kbd>SPACE</kbd> TO FLAP <span style="opacity:.55">&nbsp; • &nbsp; AVOID THE GATES</span></div>
	</div>
	<script>
	(() => {
		const canvas = document.getElementById('game');
		const ctx = canvas.getContext('2d');
		const scoreEl = document.getElementById('score');
		const bestEl = document.getElementById('best');
		const panel = document.getElementById('panel');
		const titleEl = document.getElementById('title');
		const messageEl = document.getElementById('message');
		const eyebrowEl = document.getElementById('eyebrow');
		const startBtn = document.getElementById('start');
		let w, h, dpr, last = 0, time = 0, score = 0, best = +(localStorage.getItem('skyboundBest') || 0);
		let state = 'ready', birdY = 0, velocity = 0, flapPulse = 0, gates = [], particles = [], stars = [], city = [];
		const camera = { horizon: .43 };
		const rand = (a,b) => a + Math.random()*(b-a);
		bestEl.textContent = best;

		function resize() {
			dpr = Math.min(devicePixelRatio || 1, 2);
			w = innerWidth; h = innerHeight;
			canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
			ctx.setTransform(dpr,0,0,dpr,0,0);
			stars = Array.from({length: Math.floor(w*h/8000)}, () => ({x:Math.random()*w,y:Math.random()*h*.58,r:rand(.4,1.8),p:rand(0,7)}));
			city = Array.from({length: 42}, (_,i) => ({x:i/42, width:rand(.008,.025), height:rand(.04,.18), hue:rand(190,230), seed:Math.random()}));
		}
		addEventListener('resize', resize); resize();

		function reset() {
			state = 'playing'; score = 0; scoreEl.textContent = '0';
			birdY = 0; velocity = 0; time = 0; gates = [];
			for (let i=0;i<5;i++) gates.push({z: 1.15+i*.72, gap: rand(-.03,.12), passed:false, hue:rand(155,190)});
			panel.classList.add('hidden');
			flap();
		}
		function flap() { if (state !== 'playing') return; velocity = -.58; flapPulse = 1; for(let i=0;i<5;i++) particles.push({x:w*.5+rand(-12,12), y:h*.53+rand(-8,8), vx:rand(-.8,.8), vy:rand(1,3), life:1}); }
		function action() { if (state === 'playing') flap(); else reset(); }
		startBtn.addEventListener('click', e => { e.stopPropagation(); reset(); });
		canvas.addEventListener('pointerdown', action);
		addEventListener('keydown', e => { if(e.code==='Space' || e.code==='ArrowUp') { e.preventDefault(); action(); } });

		function roundedRect(x,y,wid,hei,r) { ctx.beginPath(); ctx.roundRect(x,y,wid,hei,Math.min(r,wid/2,hei/2)); }
		function sky() {
			const grad=ctx.createLinearGradient(0,0,0,h);
			grad.addColorStop(0,'#101d49'); grad.addColorStop(.38,'#2673a2'); grad.addColorStop(.72,'#86d8d0'); grad.addColorStop(1,'#e1dda7');
			ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
			const sunX=w*.78, sunY=h*camera.horizon*.78;
			const glow=ctx.createRadialGradient(sunX,sunY,2,sunX,sunY,h*.34);
			glow.addColorStop(0,'rgba(255,238,170,.8)');glow.addColorStop(.15,'rgba(255,216,150,.27)');glow.addColorStop(1,'rgba(255,205,130,0)');
			ctx.fillStyle=glow;ctx.fillRect(0,0,w,h*.75);
			ctx.fillStyle='rgba(255,241,192,.87)';ctx.beginPath();ctx.arc(sunX,sunY,Math.max(20,w*.035),0,Math.PI*2);ctx.fill();
			stars.forEach(s=>{ctx.globalAlpha=.35+.45*Math.sin(time*1.7+s.p);ctx.fillStyle='#d5efff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
			// distant cloud banks
			for(let i=0;i<7;i++){
				const x=((i*.21-time*.012)%1.3)*w-w*.1, y=h*(.23+(i%3)*.07), scale=.55+(i%4)*.18;
				ctx.fillStyle='rgba(222,246,255,.12)';
				for(let j=0;j<4;j++){ctx.beginPath();ctx.ellipse(x+j*35*scale,y+Math.sin(j)*5,42*scale,12*scale,0,0,Math.PI*2);ctx.fill();}
			}
		}
		function groundAndCity() {
			const hz=h*camera.horizon;
			// mountain silhouettes
			for(let layer=0;layer<3;layer++){
				ctx.beginPath();ctx.moveTo(0,hz+layer*16);
				for(let x=0;x<=w+30;x+=30){const y=hz+layer*17+Math.sin(x*.009+layer*3+time*.025)*12+Math.sin(x*.022+layer)*7;ctx.lineTo(x,y);}
				ctx.lineTo(w,hz+95);ctx.lineTo(0,hz+95);ctx.closePath();ctx.fillStyle=['#4b7f96','#356c83','#24576f'][layer];ctx.globalAlpha=.34+layer*.1;ctx.fill();
			}ctx.globalAlpha=1;
			city.forEach(b=>{
				const bw=b.width*w, bh=b.height*h, x=b.x*w, y=hz+22-bh;
				ctx.fillStyle=`hsla(${b.hue},36%,${22+b.seed*9}%,.75)`;ctx.fillRect(x,y,bw,bh);
				const rows=Math.floor(bh/14), cols=Math.max(1,Math.floor(bw/10));
				ctx.fillStyle='rgba(255,221,139,.55)';
				for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if((r*7+c*3+Math.floor(b.seed*9))%4===0)ctx.fillRect(x+3+c*10,y+5+r*14,2,4);
			});
			const floor=ctx.createLinearGradient(0,hz+10,0,h);floor.addColorStop(0,'#183d57');floor.addColorStop(1,'#07182c');
			ctx.fillStyle=floor;ctx.beginPath();ctx.moveTo(0,hz+18);ctx.lineTo(w,hz+18);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
			// perspective runway grid
			ctx.strokeStyle='rgba(109,234,217,.16)';ctx.lineWidth=1;
			for(let i=-9;i<=9;i++){ctx.beginPath();ctx.moveTo(w/2+i*4,hz+15);ctx.lineTo(w/2+i*w*.13,h);ctx.stroke();}
			const scroll=(time*110)%70;
			for(let i=0;i<10;i++){let p=(i*70+scroll)/h;let y=hz+18+p*p*(h-hz);if(y<h){ctx.globalAlpha=.04+p*.13;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}}
			ctx.globalAlpha=1;
		}
		// Project a point in the flight tunnel. z=0 is the camera, larger z is farther away.
		function project(x,y,z){const f=Math.min(w,h)*.82, scale=f/(z+0.16);return {x:w/2+x*scale,y:h*.53+(y-birdY)*scale,scale};}
		function drawGate(g) {
			const z=g.z, gap=g.gap;
			const near=project(0,0,z), scale=near.scale;
			const halfW=Math.min(w*.38, .68*scale), gapH=Math.min(h*.42,.47*scale), centerY=near.y-gap*scale;
			const pipeW=Math.max(3,Math.min(w*.15,.22*scale));
			const left=w/2-halfW, right=w/2+halfW;
			const topY=centerY-gapH/2, bottomY=centerY+gapH/2;
			const farAlpha=Math.min(1,.32+scale/230);
			ctx.globalAlpha=farAlpha;
			// subtle gate glow
			ctx.shadowColor=`hsla(${g.hue},100%,62%,.55)`;ctx.shadowBlur=Math.min(24,scale*.13);
			function pipe(x,y,height,upper){
				if(height<=0)return;
				const bodyGrad=ctx.createLinearGradient(x-pipeW/2,0,x+pipeW/2,0);
				bodyGrad.addColorStop(0,'#15576a');bodyGrad.addColorStop(.18,`hsl(${g.hue},75%,45%)`);bodyGrad.addColorStop(.52,`hsl(${g.hue},95%,66%)`);bodyGrad.addColorStop(.76,`hsl(${g.hue},82%,44%)`);bodyGrad.addColorStop(1,'#103b59');
				ctx.fillStyle=bodyGrad;ctx.fillRect(x-pipeW/2,y,pipeW,height);
				ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(x-pipeW*.29,y,Math.max(1,pipeW*.06),height);
				const capH=Math.max(4,pipeW*.22), capW=pipeW*1.38, capY=upper?y+height-capH:y;
				ctx.fillStyle=`hsl(${g.hue},86%,67%)`;roundedRect(x-capW/2,capY,capW,capH,Math.min(7,capH/3));ctx.fill();
				ctx.fillStyle='rgba(255,255,255,.34)';ctx.fillRect(x-capW*.42,capY+capH*.17,capW*.84,Math.max(1,capH*.12));
				ctx.strokeStyle='rgba(205,255,247,.35)';ctx.lineWidth=Math.max(1,scale*.002);ctx.stroke();
			}
			// Four edges form two receding gate uprights in the first-person tunnel.
			const hTop=Math.max(0,topY), hBot=Math.max(0,h-bottomY);
			pipe(left,hTop,hBot?0:topY,true); // upper left
			pipe(right,hTop,hBot?0:topY,true);
			pipe(left,bottomY,hBot,false); pipe(right,bottomY,hBot,false);
			// crossbars at the edge of the safe opening
			ctx.shadowBlur=0;
			[left,right].forEach(x=>{
				ctx.strokeStyle=`hsla(${g.hue},100%,80%,.8)`;ctx.lineWidth=Math.max(1,scale*.009);
				ctx.beginPath();ctx.moveTo(x-pipeW*.68,topY);ctx.lineTo(x+pipeW*.68,topY);ctx.moveTo(x-pipeW*.68,bottomY);ctx.lineTo(x+pipeW*.68,bottomY);ctx.stroke();
			});
			// bright opening edge
			ctx.strokeStyle=`hsla(${g.hue},100%,80%,.3)`;ctx.lineWidth=Math.max(1,scale*.003);
			ctx.beginPath();ctx.moveTo(left+pipeW*.7,topY);ctx.lineTo(right-pipeW*.7,topY);ctx.moveTo(left+pipeW*.7,bottomY);ctx.lineTo(right-pipeW*.7,bottomY);ctx.stroke();
			ctx.shadowBlur=0;ctx.globalAlpha=1;
			g._bounds={top:topY,bottom:bottomY,scale,left,right,pipeW};
		}
		function drawWings() {
			const bob=Math.sin(time*8)*3+(state==='playing'?velocity*9:Math.sin(time*2)*4);
			const spread=flapPulse>0?Math.sin((1-flapPulse)*Math.PI)*18:0;
			const baseY=h*.79+bob;
			// feathers framing the view sell the bird's first-person perspective
			function wing(side){
				ctx.save();ctx.translate(w/2+side*w*.075,baseY);ctx.scale(side,1);ctx.rotate((side===1?-.10:.12)+Math.max(-.12,Math.min(.12,velocity*.13))-spread*.004);
				const wingW=Math.min(w*.42,250), wingH=Math.min(h*.17,106);
				const grad=ctx.createLinearGradient(0,-wingH,0,wingH*.3);grad.addColorStop(0,'#ffec9b');grad.addColorStop(.45,'#f7b84d');grad.addColorStop(1,'#da783d');
				ctx.fillStyle=grad;ctx.strokeStyle='#ffe3a0';ctx.lineWidth=2;
				ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(wingW*.16,-wingH*.8,wingW*.52,-wingH*.48);ctx.quadraticCurveTo(wingW*.44,-wingH*.1,wingW*.72,-wingH*.2);ctx.quadraticCurveTo(wingW*.58,wingH*.08,wingW*.88,wingH*.12);ctx.quadraticCurveTo(wingW*.51,wingH*.5,0,wingH*.24);ctx.closePath();ctx.fill();ctx.stroke();
				ctx.globalAlpha=.48;ctx.strokeStyle='#fff2c0';ctx.lineWidth=1.5;
				for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(wingW*(.08+i*.045),wingH*.12);ctx.quadraticCurveTo(wingW*(.32+i*.08),-wingH*.16,wingW*(.68+i*.035),wingH*(.07+i*.035));ctx.stroke();}
				ctx.restore();
			}
			wing(-1);wing(1);
			// small warm chest at the bottom of the view
			const chest=ctx.createRadialGradient(w/2,h*.85,2,w/2,h*.84,Math.min(w,h)*.12);chest.addColorStop(0,'#ffe49a');chest.addColorStop(.55,'#eea246');chest.addColorStop(1,'rgba(202,103,54,0)');ctx.fillStyle=chest;ctx.beginPath();ctx.ellipse(w/2,h*.87,w*.095,h*.09,0,0,Math.PI*2);ctx.fill();
		}
		function drawParticles(dt){
			particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;p.life-=dt*1.5;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#b9ffef';ctx.beginPath();ctx.arc(p.x,p.y,2.4*p.life,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
		}
		function crash(){
			state='over';
			if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('skyboundBest',best);}
			eyebrowEl.textContent='Flight complete';titleEl.textContent='Nice flight.';
			messageEl.textContent=`You flew through ${score} ${score===1?'gate':'gates'}. Ready to take another run?`;
			startBtn.textContent='Fly again';panel.classList.remove('hidden');
		}
		function update(dt){
			time+=dt;flapPulse=Math.max(0,flapPulse-dt*3.5);
			if(state==='playing'){
				velocity=Math.min(.67,velocity+1.18*dt);birdY+=velocity*dt;
				gates.forEach(g=>{g.z-=dt*(.34+Math.min(score*.006,.16));if(!g.passed&&g.z<.12){g.passed=true;score++;scoreEl.textContent=score;}});
				gates=gates.filter(g=>g.z>-.04);
				while(gates.length<5){const lastGate=gates[gates.length-1];gates.push({z:(lastGate?lastGate.z:1)+.72,gap:rand(-.11,.15),passed:false,hue:rand(155,190)});}
				const nearest=gates.find(g=>g.z<.42&&g.z>-.01);
				if(nearest){const b=nearest._bounds;const playerY=h*.53;const clear=b&&playerY>b.top+8&&playerY<b.bottom-8;if(!clear)crash();}
				if(Math.abs(birdY)>.66)crash();
			}
		}
		function render(dt){
			sky();groundAndCity();
			// Gates far to near for convincing depth ordering.
			[...gates].sort((a,b)=>b.z-a.z).forEach(drawGate);
			drawParticles(dt);drawWings();
			// vignette and cinematic color shade
			const vg=ctx.createRadialGradient(w/2,h*.47,Math.min(w,h)*.24,w/2,h*.5,Math.max(w,h)*.74);vg.addColorStop(.48,'rgba(3,14,34,0)');vg.addColorStop(1,'rgba(3,12,30,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,w,h);
			if(state==='playing'&&velocity<-.25){ctx.fillStyle=`rgba(168,255,235,${Math.min(.12,-velocity*.12)})`;ctx.fillRect(0,0,w,h);}
		}
		function loop(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);render(dt);requestAnimationFrame(loop);}
		requestAnimationFrame(loop);
	})();
	</script>
</body>
</html>
