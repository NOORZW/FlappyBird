<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#79d9ee">
	<title>Flappy Bird</title>
	<style>
		:root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: #d7f6fb; }
		main { width: min(100vw, 480px); padding: 12px; }
		.game { position: relative; overflow: hidden; border: 4px solid #fff; border-radius: 20px; box-shadow: 0 16px 48px #27647735; background: #79d9ee; }
		canvas { display: block; width: 100%; height: auto; aspect-ratio: 420 / 640; touch-action: manipulation; }
		.hud { position: absolute; inset: 14px 14px auto; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
		.badge { padding: 7px 12px; border: 2px solid #fff9; border-radius: 999px; background: #174e5cbb; color: white; font-weight: 800; font-size: 14px; text-shadow: 0 1px 2px #123; }
		.score { position: absolute; top: 52px; width: 100%; text-align: center; color: white; font-size: 48px; line-height: 1; font-weight: 900; -webkit-text-stroke: 2px #6c4a26; paint-order: stroke fill; text-shadow: 0 3px 0 #6c4a26; pointer-events: none; }
		.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 25px; background: #164c5a35; text-align: center; }
		.card { max-width: 310px; padding: 24px 24px 20px; border: 3px solid white; border-radius: 22px; background: #fffdf0; box-shadow: 0 8px 0 #b8d7ce; color: #35545a; }
		h1 { margin: 0 0 8px; color: #ef9b35; font-size: clamp(29px, 8vw, 40px); line-height: 1.05; text-shadow: 0 2px #8f592d; }
		.message { margin: 0 0 17px; font-size: 15px; line-height: 1.5; }
		button { border: 0; border-radius: 999px; padding: 12px 25px; color: white; background: #ef8e32; box-shadow: 0 4px 0 #b65b24; font: inherit; font-weight: 850; cursor: pointer; }
		button:hover { background: #f5a348; }
		button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b65b24; }
		.hint { margin: 14px 0 0; color: #f9fff9; font-size: 13px; font-weight: 700; text-shadow: 0 1px 3px #245a60; }
		[hidden] { display: none !important; }
	</style>
</head>
<body>
	<main aria-label="Flappy Bird game">
		<div class="game">
			<canvas id="game" width="420" height="640" aria-label="Game area. Tap, click, or press Space to flap."></canvas>
			<div class="hud"><span class="badge" id="best">BEST 0</span><span class="badge">SPACE / TAP</span></div>
			<div class="score" id="score">0</div>
			<section class="overlay" id="overlay">
				<div class="card">
					<h1 id="title">Flappy Bird</h1>
					<p class="message" id="message">Tap, click, or press Space to fly through the pipes.</p>
					<button id="start" type="button">Play</button>
				</div>
			</section>
		</div>
		<p class="hint">Tap, click, or press Space to flap</p>
	</main>
	<script>
		(() => {
			const canvas = document.querySelector('#game');
			const ctx = canvas.getContext('2d');
			const scoreEl = document.querySelector('#score');
			const bestEl = document.querySelector('#best');
			const overlay = document.querySelector('#overlay');
			const titleEl = document.querySelector('#title');
			const messageEl = document.querySelector('#message');
			const startBtn = document.querySelector('#start');
			const W = canvas.width, H = canvas.height, groundH = 74;
			const bird = { x: 112, y: 280, vy: 0, r: 14, angle: 0 };
			let pipes = [], score = 0, best = 0, state = 'ready', lastTime = 0, elapsed = 0;
			try { best = Number(localStorage.getItem('flappyBest')) || 0; } catch (_) {}
			bestEl.textContent = `BEST ${best}`;

			function reset() {
				bird.y = 280; bird.vy = 0; bird.angle = 0;
				pipes = []; score = 0; elapsed = 0; scoreEl.textContent = '0';
				for (let i = 0; i < 3; i++) pipes.push(makePipe(500 + i * 205));
			}
			function makePipe(x) {
				const gap = 158;
				const top = 70 + Math.random() * (H - groundH - gap - 150);
				return { x, top, gap, scored: false };
			}
			function startGame() {
				reset(); state = 'playing'; overlay.hidden = true; flap();
			}
			function flap() {
				if (state === 'ready') { startGame(); return; }
				if (state === 'over') return;
				bird.vy = -390;
			}
			function endGame() {
				if (state !== 'playing') return;
				state = 'over';
				if (score > best) {
					best = score; bestEl.textContent = `BEST ${best}`;
					try { localStorage.setItem('flappyBest', String(best)); } catch (_) {}
				}
				titleEl.textContent = 'Game over!';
				messageEl.textContent = `You scored ${score}. Ready for another flight?`;
				startBtn.textContent = 'Play again'; overlay.hidden = false;
			}

			function roundedRect(x, y, w, h, r) {
				ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
			}
			function drawBackground() {
				const sky = ctx.createLinearGradient(0, 0, 0, H);
				sky.addColorStop(0, '#72d4ed'); sky.addColorStop(1, '#c5f2e7');
				ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
				ctx.fillStyle = '#ffffff6b';
				for (const [x, y, s] of [[52, 126, 1], [295, 188, .8], [206, 75, .62]]) {
					ctx.beginPath(); ctx.arc(x, y, 19*s, 0, Math.PI*2); ctx.arc(x+22*s, y-7*s, 25*s, 0, Math.PI*2); ctx.arc(x+48*s, y, 18*s, 0, Math.PI*2); ctx.fill();
				}
				ctx.fillStyle = '#9bdfb3';
				ctx.beginPath(); ctx.moveTo(0, H-groundH); ctx.quadraticCurveTo(85, 465, 180, H-groundH); ctx.quadraticCurveTo(290, 467, W, H-groundH); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
			}
			function drawPipes() {
				for (const p of pipes) {
					const bottomY = p.top + p.gap;
					ctx.fillStyle = '#40b849';
					roundedRect(p.x, -5, 58, p.top + 5, 7);
					roundedRect(p.x-5, p.top-24, 68, 24, 5);
					roundedRect(p.x, bottomY, 58, H-groundH-bottomY+5, 7);
					roundedRect(p.x-5, bottomY, 68, 24, 5);
					ctx.fillStyle = '#8be45d';
					ctx.fillRect(p.x+8, 0, 8, Math.max(0, p.top-25));
					ctx.fillRect(p.x+8, bottomY+26, 8, Math.max(0, H-groundH-bottomY-26));
				}
			}
			function drawBird() {
				ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(bird.angle);
				ctx.fillStyle = '#f5bc38'; ctx.strokeStyle = '#b96b35'; ctx.lineWidth = 2.5;
				ctx.beginPath(); ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
				ctx.fillStyle = '#f59632'; ctx.beginPath(); ctx.ellipse(-5, 5, 9, 5, -.35, 0, Math.PI*2); ctx.fill(); ctx.stroke();
				ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -6, 5.2, 0, Math.PI*2); ctx.fill();
				ctx.fillStyle = '#263d46'; ctx.beginPath(); ctx.arc(10, -6, 2.3, 0, Math.PI*2); ctx.fill();
				ctx.fillStyle = '#ef7132'; ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(26, 3); ctx.lineTo(15, 7); ctx.closePath(); ctx.fill();
				ctx.restore();
			}
			function drawGround() {
				ctx.fillStyle = '#ded18a'; ctx.fillRect(0, H-groundH, W, groundH);
				ctx.fillStyle = '#72c94e'; ctx.fillRect(0, H-groundH, W, 13);
				ctx.fillStyle = '#a4e56a'; ctx.fillRect(0, H-groundH, W, 5);
				ctx.strokeStyle = '#c4b76f'; ctx.lineWidth = 3;
				for (let x = -20; x < W+20; x += 34) { ctx.beginPath(); ctx.moveTo(x, H-42); ctx.lineTo(x+18, H-30); ctx.stroke(); }
			}
			function update(dt) {
				if (state !== 'playing') {
					if (state === 'ready') { elapsed += dt; bird.y = 280 + Math.sin(elapsed*3)*8; }
					return;
				}
				bird.vy += 1150 * dt; bird.y += bird.vy * dt;
				bird.angle = Math.min(.95, Math.max(-.55, bird.vy / 570));
				for (const p of pipes) {
					p.x -= 155 * dt;
					if (!p.scored && p.x + 58 < bird.x) { p.scored = true; score++; scoreEl.textContent = score; }
					const bx = bird.x, by = bird.y, r = bird.r;
					if (bx+r > p.x-4 && bx-r < p.x+62 && (by-r < p.top || by+r > p.top+p.gap)) endGame();
				}
				if (pipes.length && pipes[0].x < -70) pipes.shift();
				if (!pipes.length || pipes[pipes.length-1].x < W-205) pipes.push(makePipe(W+10));
				if (bird.y+bird.r >= H-groundH || bird.y-bird.r <= 0) endGame();
			}
			function frame(time) {
				const dt = Math.min((time-lastTime)/1000 || 0, .035); lastTime = time;
				update(dt); drawBackground(); drawPipes(); drawBird(); drawGround();
				requestAnimationFrame(frame);
			}
			startBtn.addEventListener('click', startGame);
			canvas.addEventListener('pointerdown', (event) => { event.preventDefault(); flap(); });
			window.addEventListener('keydown', (event) => {
				if (event.code === 'Space' || event.code === 'ArrowUp') { event.preventDefault(); flap(); }
				if (event.code === 'Enter' && state !== 'playing') startGame();
			});
			reset(); requestAnimationFrame(frame);
		})();
	</script>
</body>
</html>
