<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird V6</title>
  <style>
    :root {
      --bg1: #7dd3fc;
      --bg2: #dbeafe;
      --pipe: #4ade80;
      --pipe-dark: #16a34a;
      --ground: #d9a441;
      --ground-dark: #b7791f;
      --accent: #fbbf24;
      --text: #0f172a;
      --highlight: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      font-family: Arial, Helvetica, sans-serif;
    }

    #game-wrap {
      width: min(92vw, 430px);
      aspect-ratio: 7 / 10;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.35);
      border: 4px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      cursor: pointer;
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .score {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--highlight);
      text-shadow: 0 4px 0 rgba(15, 23, 42, 0.25);
      z-index: 2;
    }

    .message {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 0 rgba(15, 23, 42, 0.35);
      z-index: 2;
      user-select: none;
    }

    .message h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 8vw, 52px);
    }

    .message p {
      margin: 0;
      font-size: clamp(11px, 2.7vw, 17px);
      opacity: 0.95;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="420" height="600"></canvas>
    <div class="hud">
      <div id="score" class="score">0</div>
      <div id="message" class="message">
        <h1>Flappy</h1>
        <p>Click / Space to start</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const messageEl = document.getElementById('message');

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const GROUND_HEIGHT = 70;
    const SKY_TOP = 0;
    const SKY_BOTTOM = HEIGHT - GROUND_HEIGHT;

    const state = {
      started: false,
      gameOver: false,
      score: 0,
      best: 0,
      pipes: [],
      spawnTimer: 0,
      lastTime: 0,
      groundOffset: 0,
      bird: {
        x: 110,
        y: HEIGHT * 0.42,
        radius: 15,
        vy: 0,
        rot: 0
      }
    };

    function resetGame() {
      state.started = false;
      state.gameOver = false;
      state.score = 0;
      state.pipes = [];
      state.spawnTimer = 90;
      state.groundOffset = 0;
      state.bird.y = HEIGHT * 0.42;
      state.bird.vy = 0;
      state.bird.rot = 0;
      scoreEl.textContent = '0';
      showMessage('Flappy', 'Click / Space to start');
    }

    function showMessage(title, sub) {
      messageEl.innerHTML = `<h1>${title}</h1><p>${sub}</p>`;
      messageEl.classList.remove('hidden');
    }

    function hideMessage() {
      messageEl.classList.add('hidden');
    }

    function flap() {
      if (state.gameOver) {
        resetGame();
      }

      if (!state.started) {
        state.started = true;
        hideMessage();
      }

      if (state.gameOver) {
        state.started = true;
        hideMessage();
      }

      state.bird.vy = -6.8;
      state.bird.rot = -1.1;
    }

    function spawnPipe() {
      const gap = 165;
      const minTop = 70;
      const maxTop = SKY_BOTTOM - gap - 70;
      const topHeight = minTop + Math.random() * (maxTop - minTop);
      const pipeWidth = 68;
      const x = WIDTH + 20;

      state.pipes.push({
        x,
        width: pipeWidth,
        gap,
        topHeight,
        scored: false
      });
    }

    function update(dt) {
      const bird = state.bird;

      if (!state.started || state.gameOver) {
        bird.y += Math.sin((performance.now() * 0.004)) * 0.5;
        state.groundOffset = (state.groundOffset + 2.5 * dt) % 36;
        return;
      }

      bird.vy += 0.38 * dt;
      bird.y += bird.vy * dt;
      bird.rot = Math.min(Math.max(bird.vy / 10, -1.15), 1.2);

      state.groundOffset = (state.groundOffset + 4.5 * dt) % 36;
      state.spawnTimer -= dt;
      if (state.spawnTimer <= 0) {
        spawnPipe();
        state.spawnTimer = 95;
      }

      for (const pipe of state.pipes) {
        pipe.x -= 2.9 * dt;

        if (!pipe.scored && pipe.x + pipe.width < bird.x) {
          pipe.scored = true;
          state.score += 1;
          scoreEl.textContent = String(state.score);
          state.best = Math.max(state.best, state.score);
        }
      }

      state.pipes = state.pipes.filter(pipe => pipe.x + pipe.width > -10);

      const birdLeft = bird.x - bird.radius;
      const birdRight = bird.x + bird.radius;
      const birdTop = bird.y - bird.radius;
      const birdBottom = bird.y + bird.radius;

      if (bird.y + bird.radius >= SKY_BOTTOM || bird.y - bird.radius <= 0) {
        hit();
      }

      for (const pipe of state.pipes) {
        const pipeLeft = pipe.x;
        const pipeRight = pipe.x + pipe.width;
        const topBottom = pipe.topHeight;
        const bottomTop = pipe.topHeight + pipe.gap;

        const overlapsX = birdRight > pipeLeft && birdLeft < pipeRight;

        if (overlapsX) {
          const hitTop = birdTop < topBottom;
          const hitBottom = birdBottom > bottomTop;
          if (hitTop || hitBottom) {
            hit();
            break;
          }
        }
      }
    }

    function hit() {
      if (state.gameOver) return;
      state.gameOver = true;
      state.started = false;
      state.best = Math.max(state.best, state.score);
      showMessage('Game Over', `Score: ${state.score}  •  Best: ${state.best}`);
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      sky.addColorStop(0, '#79d7ff');
      sky.addColorStop(0.72, '#dff6ff');
      sky.addColorStop(1, '#eafcff');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.beginPath();
      ctx.arc(WIDTH - 75, 80, 42, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < 5; i++) {
        const x = 40 + i * 100 + ((state.groundOffset * 1.2) % 100);
        const y = 70 + (i % 2) * 30;
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.arc(x + 20, y - 8, 22, 0, Math.PI * 2);
        ctx.arc(x + 42, y + 3, 18, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#a3e635';
      ctx.fillRect(0, SKY_BOTTOM, WIDTH, GROUND_HEIGHT);

      ctx.fillStyle = '#65a30d';
      for (let x = -40; x < WIDTH + 40; x += 28) {
        const px = x - (state.groundOffset % 36);
        ctx.fillRect(px, SKY_BOTTOM + 12, 18, 8);
        ctx.fillRect(px + 9, SKY_BOTTOM + 24, 18, 8);
      }

      ctx.fillStyle = '#b45309';
      ctx.fillRect(0, SKY_BOTTOM + 44, WIDTH, 26);
    }

    function drawPipe(pipe) {
      const topHeight = pipe.topHeight;
      const bottomY = pipe.topHeight + pipe.gap;
      const pipeWidth = pipe.width;

      ctx.fillStyle = '#4ade80';
      ctx.fillRect(pipe.x, 0, pipeWidth, topHeight);
      ctx.fillRect(pipe.x, bottomY, pipeWidth, SKY_BOTTOM - bottomY + 5);

      ctx.fillStyle = '#22c55e';
      ctx.fillRect(pipe.x - 8, topHeight - 18, pipeWidth + 16, 18);
      ctx.fillRect(pipe.x - 8, bottomY, pipeWidth + 16, 18);

      ctx.fillStyle = '#16a34a';
      ctx.fillRect(pipe.x + 8, 0, 12, topHeight);
      ctx.fillRect(pipe.x + 8, bottomY, 12, SKY_BOTTOM - bottomY + 5);
    }

    function drawBird() {
      const { x, y, radius, rot } = state.bird;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.ellipse(0, 0, radius, radius * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.moveTo(radius * 0.8, 2);
      ctx.lineTo(radius * 1.7, 0);
      ctx.lineTo(radius * 0.8, -6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(5, -5, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111827';
      ctx.beginPath();
      ctx.arc(7, -6, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-6, 9);
      ctx.lineTo(-1, 15);
      ctx.moveTo(5, 9);
      ctx.lineTo(1, 15);
      ctx.stroke();

      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(-5, 8);
      ctx.lineTo(-11, 12);
      ctx.lineTo(-5, 14);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function draw() {
      drawBackground();

      for (const pipe of state.pipes) {
        drawPipe(pipe);
      }

      drawBird();

      if (!state.started && !state.gameOver) {
        ctx.fillStyle = 'rgba(15,23,42,0.15)';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }
    }

    function loop(timestamp) {
      const dt = Math.min((timestamp - state.lastTime) / 16.67 || 1, 2.2);
      state.lastTime = timestamp;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space' || event.code === 'ArrowUp' || event.code === 'KeyW') {
        event.preventDefault();
        flap();
      }
    });

    canvas.addEventListener('pointerdown', flap);

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
