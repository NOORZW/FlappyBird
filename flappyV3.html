<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101a3c">
<title>Flappy V3 — Skybound</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{color-scheme:dark;--ink:#f7f8ff;--muted:#a9b5dc;--glass:rgba(15,24,58,.68);--line:rgba(255,255,255,.16);--gold:#ffda72;--cyan:#82f4ed}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:#101a3c;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;display:grid;place-items:center;user-select:none;-webkit-tap-highlight-color:transparent}
.shell{position:relative;width:min(100vw,480px);height:min(100dvh,850px);min-height:500px;overflow:hidden;background:#8be3ee;isolation:isolate;box-shadow:0 24px 100px #020614aa}
canvas{display:block;width:100%;height:100%;touch-action:none}
.topbar{position:absolute;z-index:3;top:18px;left:18px;right:18px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{font:700 14px 'Space Grotesk',sans-serif;letter-spacing:.13em;text-shadow:0 2px 8px #18396066}.brand b{color:var(--gold)}.icon-btn{pointer-events:auto;border:1px solid var(--line);background:#15234c66;color:white;width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:18px;cursor:pointer;backdrop-filter:blur(12px);transition:transform .2s,background .2s}.icon-btn:hover{transform:translateY(-2px);background:#263968aa}.hud{position:absolute;z-index:2;top:82px;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 3px 14px #17407870}.score{font:700 clamp(54px,15vw,78px)/1 'Space Grotesk',sans-serif;letter-spacing:-.07em}.best{margin-top:5px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff9}.overlay{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,transparent 28%,#09122b30);transition:opacity .25s}.overlay.hidden{opacity:0;pointer-events:none}.card{width:min(100%,360px);padding:28px 25px 24px;text-align:center;border:1px solid #ffffff24;border-radius:28px;background:linear-gradient(145deg,#172651df,#111a3be8);box-shadow:0 24px 70px #09112666;backdrop-filter:blur(18px);animation:pop .45s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:none;opacity:1}}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}.card h1{font:700 clamp(35px,10vw,48px)/.98 'Space Grotesk',sans-serif;letter-spacing:-.06em;margin:12px 0 10px}.card h1 span{color:var(--gold)}.desc{color:#c3cbea;font-size:14px;line-height:1.55;margin:0 auto 21px;max-width:275px}.primary{width:100%;border:0;border-radius:16px;padding:15px 20px;background:linear-gradient(135deg,#ffe48a,#ffbb55);color:#322344;font:800 15px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 7px 0 #d88a3d,0 12px 25px #070d2580;transition:transform .15s,filter .15s}.primary:hover{filter:brightness(1.06);transform:translateY(-2px)}.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #d88a3d}.hint{margin-top:15px;color:#a8b5da;font-size:11px;letter-spacing:.04em}.stats{display:flex;gap:10px;margin:17px 0}.stat{flex:1;padding:12px 8px;border-radius:15px;background:#ffffff0b;border:1px solid #ffffff10}.stat strong{display:block;font:700 22px 'Space Grotesk',sans-serif;color:var(--gold)}.stat small{font-size:9px;letter-spacing:.12em;color:#aeb9d9}.toast{position:absolute;z-index:3;left:50%;bottom:28px;transform:translate(-50%,10px);padding:10px 15px;border:1px solid #ffffff22;border-radius:99px;background:#14234ddd;color:#fff;font-size:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.touch-hint{position:absolute;z-index:1;bottom:25px;left:0;right:0;text-align:center;color:#fff9;font-size:11px;letter-spacing:.13em;text-transform:uppercase;pointer-events:none;transition:opacity .3s}.touch-hint.off{opacity:0}
@media(max-height:620px){.topbar{top:10px}.hud{top:62px}.card{padding:20px}.card h1{font-size:38px}.desc{margin-bottom:14px}.touch-hint{bottom:12px}}
</style>
</head>
<body>
<main class="shell" id="shell" aria-label="Flappy V3 game">
	<canvas id="game" aria-label="Tap, click, or press space to fly"></canvas>
	<div class="topbar"><div class="brand">SKYBOUND <b>· V3</b></div><button class="icon-btn" id="soundBtn" aria-label="Toggle sound">♫</button></div>
	<div class="hud"><div class="score" id="score">0</div><div class="best" id="best">BEST&nbsp; 0</div></div>
	<div class="overlay" id="overlay"><section class="card" id="card"></section></div>
	<div class="touch-hint" id="touchHint">Tap anywhere to flap</div><div class="toast" id="toast"></div>
</main>
<script>
(()=>{
	'use strict';
	const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
	const shell=document.querySelector('#shell'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');
	const overlay=document.querySelector('#overlay'),card=document.querySelector('#card'),soundBtn=document.querySelector('#soundBtn');
	const hint=document.querySelector('#touchHint'),toastEl=document.querySelector('#toast');
	const TAU=Math.PI*2, rand=(a,b)=>a+Math.random()*(b-a), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
	let W=0,H=0,dpr=1,last=0,mode='menu',score=0,best=Number(localStorage.getItem('skybound-best')||0),pipes=[],particles=[],clouds=[],stars=[],floaters=[];
	let soundOn=localStorage.getItem('skybound-sound')!=='off',audio=null,toastTimer=0,shake=0,flash=0,worldTime=0;
	const bird={x:0,y:0,vy:0,r:15,rot:0,wing:0};
	const palettes=[['#88e4ed','#d5f8ee','#77c99a','#319d88'],['#ffb88e','#ffe7ad','#9b78c5','#634d9c'],['#182852','#526fba','#546fd0','#3347a6']];
	let palette=palettes[0];
	function resize(){const r=shell.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);bird.x=W*.29;bird.r=clamp(W*.038,13,17);if(mode!=='play')bird.y=H*.43;clouds=Array.from({length:7},(_,i)=>({x:rand(0,W),y:rand(55,H*.75),s:rand(.45,1.15),speed:rand(7,18)}));stars=Array.from({length:55},()=>({x:rand(0,W),y:rand(0,H*.68),r:rand(.5,1.8),a:rand(.2,.8)}))}
	function sound(freq=500,dur=.08,wave='sine',vol=.045){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=wave;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(_){}}
	function showToast(text){toastEl.textContent=text;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1400)}
	function updateHud(){scoreEl.textContent=score;bestEl.innerHTML=`BEST&nbsp; ${best}`}
	function menu(){mode='menu';score=0;updateHud();overlay.classList.remove('hidden');hint.classList.remove('off');card.innerHTML=`<div class="eyebrow">A tiny bird. A huge sky.</div><h1>FLAPPY<br><span>V3</span></h1><p class="desc">Catch the breeze, thread the gates, and see how far your wings can take you.</p><button class="primary" id="start">LET'S FLY&nbsp; ↗</button><div class="hint">SPACE · CLICK · TAP</div>`;document.querySelector('#start').onclick=()=>start()}
	function start(){if(mode==='play')return;mode='play';score=0;pipes=[];particles=[];floaters=[];bird.y=H*.43;bird.vy=0;bird.rot=0;worldTime=0;shake=0;flash=0;palette=palettes[0];overlay.classList.add('hidden');hint.classList.add('off');spawnPipe(W+60);flap();last=performance.now()}
	function gameOver(){if(mode!=='play')return;mode='over';sound(130,.28,'sawtooth',.06);shake=13;flash=.4;burst(bird.x,bird.y,'#ffe071',18);if(score>best){best=score;localStorage.setItem('skybound-best',best);updateHud()}overlay.classList.remove('hidden');hint.classList.add('off');card.innerHTML=`<div class="eyebrow">${score>0?'Nice flight!':'The sky is waiting.'}</div><h1>WING<br><span>DOWN</span></h1><div class="stats"><div class="stat"><strong>${score}</strong><small>YOUR SCORE</small></div><div class="stat"><strong>${best}</strong><small>PERSONAL BEST</small></div></div><button class="primary" id="again">FLY AGAIN&nbsp; ↻</button><div class="hint">${score>=10?'Legend status is calling.':'Every try gets you closer.'}</div>`;document.querySelector('#again').onclick=()=>start()}
	function spawnPipe(x){const gap=clamp(H*.255,150,205),margin=H*.16;const cy=rand(margin+gap/2,H-margin-gap/2);pipes.push({x,cy,gap,w:clamp(W*.16,61,72),passed:false,glow:rand(0,TAU),coin:Math.random()<.42,coinTaken:false})}
	function flap(){if(mode==='menu'){start();return}if(mode==='over'){start();return}if(mode!=='play')return;bird.vy=-H*.57;sound(620,.075,'triangle',.035);burst(bird.x-8,bird.y+5,'#fff2b0',3)}
	function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-125,55),vy:rand(-145,100),life:rand(.25,.65),max:.65,r:rand(2,5),color})}
	function addScore(p){score++;p.passed=true;updateHud();sound(880,.12,'sine',.055);floaters.push({x:p.x+p.w/2,y:p.cy,text:'+1',life:.8});burst(p.x+p.w/2,p.cy,'#fff0a5',9);if(score%5===0){palette=palettes[(Math.floor(score/5))%palettes.length];showToast(['Fresh skies unlocked ✨','New altitude! 🌤','Keep soaring! ⭐'][Math.floor(score/5)%3])}}
	function circleRect(cx,cy,r,x,y,w,h){const qx=clamp(cx,x,x+w),qy=clamp(cy,y,y+h);return (cx-qx)**2+(cy-qy)**2<r*r}
	function update(dt){worldTime+=dt;if(mode==='play'){bird.vy+=H*1.52*dt;bird.y+=bird.vy*dt;bird.rot=clamp(bird.vy/650,-.48,1.15);bird.wing+=dt*15;const speed=W*.47+Math.min(score*4,120);if(!pipes.length||pipes[pipes.length-1].x<W*.57)spawnPipe(W+25);for(const p of pipes){p.x-=speed*dt;p.glow+=dt*2;if(!p.passed&&p.x+p.w<bird.x) addScore(p);const top=p.cy-p.gap/2,bottom=p.cy+p.gap/2;if(circleRect(bird.x,bird.y,bird.r*.78,p.x,-10,p.w,top+10)||circleRect(bird.x,bird.y,bird.r*.78,p.x,bottom,p.w,H-bottom+10)){gameOver();break}if(p.coin&&!p.coinTaken){const cx=p.x+p.w/2,cy=p.cy;if(Math.hypot(cx-bird.x,cy-bird.y)<bird.r+12){p.coinTaken=true;score+=2;updateHud();sound(1050,.16,'sine',.05);burst(cx,cy,'#ffe17d',15);showToast('Sky coin +2 ✨')}}}pipes=pipes.filter(p=>p.x+p.w>-20);if(bird.y+bird.r>H*.91||bird.y-bird.r<0)gameOver()}else{bird.wing+=dt*3;bird.y=H*.43+Math.sin(worldTime*2.7)*7}for(const c of clouds){c.x-=c.speed*dt;if(c.x<-100)c.x=W+90,c.y=rand(45,H*.75)}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const f of floaters){f.y-=35*dt;f.life-=dt}floaters=floaters.filter(f=>f.life>0);shake=Math.max(0,shake-35*dt);flash=Math.max(0,flash-dt)}
	function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
	function drawBackground(){const night=palette===palettes[2],g=ctx.createLinearGradient(0,0,0,H);if(night){g.addColorStop(0,'#111a3c');g.addColorStop(.63,'#354f92');g.addColorStop(1,'#7898bd')}else{g.addColorStop(0,palette[0]);g.addColorStop(.68,palette[1]);g.addColorStop(1,'#f9dfa8')}ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(night){for(const s of stars){ctx.globalAlpha=s.a*(.7+.3*Math.sin(worldTime*2+s.x));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill()}ctx.globalAlpha=1}const sunX=W*.77,sunY=H*.23;const halo=ctx.createRadialGradient(sunX,sunY,5,sunX,sunY,H*.24);halo.addColorStop(0,night?'#e4e9ff66':'#fff6c688');halo.addColorStop(1,'#fff0c000');ctx.fillStyle=halo;ctx.fillRect(sunX-H*.25,sunY-H*.25,H*.5,H*.5);ctx.fillStyle=night?'#f0eaff':'#fff3c9';ctx.beginPath();ctx.arc(sunX,sunY,night?23:27,0,TAU);ctx.fill();for(const c of clouds){ctx.save();ctx.globalAlpha=night?.17:.32;ctx.fillStyle=night?'#dce4ff':'#fff';const x=c.x,y=c.y,s=c.s;ctx.beginPath();ctx.ellipse(x,y,36*s,12*s,0,0,TAU);ctx.ellipse(x-19*s,y+1*s,18*s,10*s,0,0,TAU);ctx.ellipse(x+13*s,y-8*s,20*s,17*s,0,0,TAU);ctx.ellipse(x+31*s,y+2*s,15*s,9*s,0,0,TAU);ctx.fill();ctx.restore()}drawHills(H*.77, palette===palettes[2]?'#6178a8':'#b4d8a2',.012,worldTime*.17);drawHills(H*.84,palette===palettes[2]?'#435d91':'#83c99d',.02,worldTime*.27);const gy=H*.91;ctx.fillStyle='#4b9b79';ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='#a5d37b';ctx.fillRect(0,gy,W,7);ctx.fillStyle='#ffffff1c';for(let x=-(worldTime*80%32);x<W;x+=32)ctx.fillRect(x,gy+14,16,3);ctx.fillStyle='#223d5966';ctx.fillRect(0,gy+29,W,H-gy-29)}
	function drawHills(base,color,amp,offset){ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,base);for(let x=0;x<=W+10;x+=10){const y=base-Math.sin((x+offset*100)*amp)*H*.035-Math.sin((x-offset*37)*amp*2.1)*H*.018;ctx.lineTo(x,y)}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
	function drawPipe(p){const top=p.cy-p.gap/2,bottom=p.cy+p.gap/2;const grad=ctx.createLinearGradient(p.x,0,p.x+p.w,0);grad.addColorStop(0,'#287d72');grad.addColorStop(.18,'#66c6a0');grad.addColorStop(.5,'#3da68e');grad.addColorStop(1,'#24756e');ctx.shadowColor='#204d6850';ctx.shadowBlur=12;ctx.fillStyle=grad;roundedRect(p.x,-16,p.w,top+16,8);roundedRect(p.x-5,top-18,p.w+10,20,7);roundedRect(p.x,bottom,p.w,H-bottom+5,8);roundedRect(p.x-5,bottom-2,p.w+10,20,7);ctx.shadowBlur=0;ctx.fillStyle='#ffffff30';ctx.fillRect(p.x+9,0,4,Math.max(0,top-19));ctx.fillRect(p.x+9,bottom+23,4,H-bottom-23);if(p.coin&&!p.coinTaken){const cy=p.cy+Math.sin(worldTime*5+p.glow)*4,cx=p.x+p.w/2;ctx.save();ctx.shadowColor='#ffe273';ctx.shadowBlur=16;ctx.fillStyle='#ffe787';ctx.beginPath();ctx.arc(cx,cy,11,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#cb853b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,6,0,TAU);ctx.stroke();ctx.restore()}}
	function drawBird(){const x=bird.x,y=bird.y;ctx.save();ctx.translate(x,y);ctx.rotate(bird.rot);ctx.shadowColor='#27305055';ctx.shadowBlur=10;ctx.shadowOffsetY=5;const body=ctx.createLinearGradient(-bird.r,-bird.r,bird.r,bird.r);body.addColorStop(0,'#fff19a');body.addColorStop(.65,'#ffc85e');body.addColorStop(1,'#f08b56');ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,bird.r*1.1,bird.r*.88,0,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.fillStyle='#fff2b0';ctx.beginPath();ctx.ellipse(-4,4,bird.r*.56,bird.r*.34,Math.sin(bird.wing)*.4,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(7,-5,6.1,7,0,0,TAU);ctx.fill();ctx.fillStyle='#22314b';ctx.beginPath();ctx.arc(9,-4,2.4,0,TAU);ctx.fill();ctx.fillStyle='#f17b54';ctx.beginPath();ctx.moveTo(bird.r*.77,-1);ctx.lineTo(bird.r*1.55,2);ctx.lineTo(bird.r*.75,6);ctx.closePath();ctx.fill();ctx.restore()}
	function draw(){ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawBackground();for(const p of pipes)drawPipe(p);for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*clamp(p.life/p.max,.25,1),0,TAU);ctx.fill()}ctx.globalAlpha=1;for(const f of floaters){ctx.globalAlpha=clamp(f.life*2,0,1);ctx.fillStyle='#fff2a1';ctx.font='800 16px DM Sans';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;if(mode!=='over'||bird.y<H)drawBird();if(flash){ctx.globalAlpha=flash*1.5;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}ctx.restore()}
	function frame(t){const dt=Math.min((t-last)/1000||0,.035);last=t;update(dt);draw();requestAnimationFrame(frame)}
	shell.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;flap()});window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)flap()}if(e.code==='Escape'&&mode==='play'){mode='paused';overlay.classList.remove('hidden');card.innerHTML='<div class="eyebrow">Take a breather</div><h1>PAUSE</h1><p class="desc">Your bird is holding its wings.</p><button class="primary" id="resume">KEEP FLYING&nbsp; →</button><div class="hint">PRESS SPACE TO RESUME</div>';document.querySelector('#resume').onclick=resume}});
	function resume(){mode='play';overlay.classList.add('hidden');last=performance.now()}
	soundBtn.textContent=soundOn?'♫':'♩';soundBtn.addEventListener('click',()=>{soundOn=!soundOn;localStorage.setItem('skybound-sound',soundOn?'on':'off');soundBtn.textContent=soundOn?'♫':'♩';showToast(soundOn?'Sound on ♪':'Sound off')});bestEl.innerHTML=`BEST&nbsp; ${best}`;resize();window.addEventListener('resize',resize);menu();requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>
</body>
</html>
